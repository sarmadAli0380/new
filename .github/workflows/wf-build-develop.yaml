name: wf-build-develop
on:
  push:
    branches:
      - develop
jobs:
  build-develop-job:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v4
      - name: buildwebsite
        run: |
          npx parcel build "./src/index.html" --dist-dir "./dev" --public-url "./"
      - name: upload atrifact
        uses: actions/build-pages-artifact@v3
        with:
          path: "./dev"
          name: "build-artifact-develop"

  deploy-develop-job:
    needs: "build-develop-job"
    environment: "deployment-env"
    permissions: 
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name : deploy artifacts on GH pages
        uses: actions/deploy-pages@v4
        with: 
          name: "build-artifact-develop" 
          token: ${{github.token}}

